name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python syntax and critical lint
        run: |
          python -m compileall -q app agents evals
          ruff check app agents tests evals --select E9,F63,F7,F82
      - name: Model type check
        run: mypy app/models app/config.py
      - name: JavaScript syntax
        run: |
          node --check app/static/api-client.js
          node --check app/static/state.js
          node --check app/static/app.js
      - name: Unit and integration tests
        run: coverage run -m pytest
      - name: Coverage gate
        run: coverage report
      - name: AI quality evals
        run: python evals/run_evals.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt
