name: windows-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Test
        run: python -m pytest -q
      - name: Build desktop bundle
        run: python -m PyInstaller --noconfirm --clean packaging/WinAssist.spec
      - name: Download and verify WebView2 prerequisite
        shell: pwsh
        run: ./packaging/download-prerequisites.ps1
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc packaging/WinAssist.iss
      - name: Smoke test installer and uninstaller
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "WinAssist-release-smoke"
          $installLog = Join-Path $env:RUNNER_TEMP "WinAssist-install-smoke.log"
          $installer = Get-ChildItem dist/installer/WinAssist-*-Setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/DIR=`"$smokeDir`"", "/LOG=`"$installLog`"",
            "/MERGETASKS=desktopicon", "/UPDATE=1"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path (Join-Path $smokeDir "WinAssist.exe"))) {
            if (Test-Path $installLog) { Get-Content $installLog }
            throw "Installer smoke test failed."
          }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "WinAssist.lnk"
          if (-not (Test-Path $desktopShortcut)) { throw "Desktop shortcut was not preserved." }
          $uninstaller = Join-Path $smokeDir "unins000.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/PURGEDATA=1"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller smoke test failed." }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $smokeDir); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $smokeDir) { throw "Uninstaller left installation files behind." }
          if (Test-Path $desktopShortcut) { throw "Uninstaller left the desktop shortcut behind." }
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/installer/WinAssist-*-Setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
          Copy-Item $installer.FullName dist/installer/WinAssist-Setup.exe
          "$hash  WinAssist-Setup.exe" | Set-Content dist/installer/WinAssist-Setup.exe.sha256 -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinAssist-Windows
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/installer/*.sha256
          generate_release_notes: true
